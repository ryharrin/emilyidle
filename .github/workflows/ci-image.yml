name: Build and Push CI Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.ci
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ryharrin/emilyidle-ci
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Prepare minimal build context
        run: |
          mkdir -p .ci-image-context
          cp Dockerfile.ci package.json pnpm-lock.yaml .ci-image-context/

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .ci-image-context
          file: .ci-image-context/Dockerfile.ci
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
