name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-typecheck:
    name: Unit + Typecheck
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ryharrin/emilyidle-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure pnpm 9.15.0
        run: npm install -g --force pnpm@9.15.0

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: /pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run typecheck
        run: pnpm run typecheck

  e2e:
    name: E2E ${{ matrix.project }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ryharrin/emilyidle-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - webkit-mobile-iphone15
        shard:
          - 1/5
          - 2/5
          - 3/5
          - 4/5
          - 5/5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure pnpm 9.15.0
        run: npm install -g --force pnpm@9.15.0

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: /pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run e2e shard
        run: PLAYWRIGHT_E2E_PROFILE=stable pnpm exec playwright test --project="${{ matrix.project }}" --shard="${{ matrix.shard }}" --grep-invert @manual

  build-pages:
    name: Build Pages Artifact
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - unit-and-typecheck
      - e2e
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ryharrin/emilyidle-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure pnpm 9.15.0
        run: npm install -g --force pnpm@9.15.0

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: /pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
