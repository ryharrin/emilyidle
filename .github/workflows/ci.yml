name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-typecheck:
    name: Unit + Typecheck
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ryharrin/emilyidle-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: /pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run typecheck
        run: pnpm run typecheck

  e2e:
    name: E2E ${{ matrix.project }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ryharrin/emilyidle-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - webkit-mobile-iphone15
        shard:
          - 1/5
          - 2/5
          - 3/5
          - 4/5
          - 5/5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: /pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run e2e shard
        run: PLAYWRIGHT_E2E_PROFILE=stable pnpm exec playwright test --project="${{ matrix.project }}" --shard="${{ matrix.shard }}" --grep-invert @manual
