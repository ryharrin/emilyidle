name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-typecheck:
    name: Unit + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run typecheck
        run: pnpm run typecheck

  e2e:
    name: E2E ${{ matrix.project }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: 1/3
          - project: chromium
            shard: 2/3
          - project: chromium
            shard: 3/3
          - project: webkit-mobile-iphone15
            shard: 1/2
          - project: webkit-mobile-iphone15
            shard: 2/2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run e2e shard
        run: PLAYWRIGHT_E2E_PROFILE=stable pnpm exec playwright test --project="${{ matrix.project }}" --shard="${{ matrix.shard }}" --grep-invert @manual
