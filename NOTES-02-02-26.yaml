  - id: quartz-mini-game-reward
    priority: MEDIUM
    question: "Should the quartz mini-game reward enjoyment instead of cash?"
    context: "NOTES.md line 102 states 'mini games should reward enjoyment, not cash'"
    current_behavior: "Quartz mini-game rewards cash (100/250/500 cents)"
    other_games:
