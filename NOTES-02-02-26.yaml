# ============================================================================
# ARCHITECTURE REFERENCE
# ============================================================================

architecture:
  model_layer:
    types: "src/game/model/types.ts - GameState, WatchItemId, etc."
    state: "src/game/model/state.ts - ACHIEVEMENTS, EVENTS, UPGRADES"

  data_layer:
    items: "src/game/data/items.ts - WATCH_ITEMS, NOSTALGIA_UNLOCK_ORDER"
    career: "src/game/data/career*.ts - tracks, nodes, stages"
    catalog: "src/game/catalog.ts - CATALOG_ENTRIES, brands"

  logic_layer:
    selectors: "src/game/selectors/ - pure computed values"
    actions: "src/game/actions/ - state transitions"
    runtime: "src/game/runtime/ - tick loop, autosave"

  ui_layer:
    tabs: "src/ui/tabs/ - CareerTab, CatalogTab, CollectionTab, etc."
    components: "src/ui/components/ - mini-games, modals"
    navigation: "src/ui/navigation/landing.ts - tab landing logic"
    styles: "src/style.css - all styling"

  key_constants:
    prestige_thresholds:
      workshop: "800,000 cents"
      maison: "4,000,000 cents"
      nostalgia: "12,000,000 cents"
    salary_window:
      base: "180,000 ms (3 min)"
      per_point: "30,000 ms"
      max: "1,800,000 ms (30 min)"
    worn_watch_multipliers:
      starter: 1.02
      classic: 1.05
      chronograph: 1.08
      tourbillon: 1.12
    duplicate_decay:
      rate: "0.7^copyIndex"
      floor: "0.1 (10%)"

