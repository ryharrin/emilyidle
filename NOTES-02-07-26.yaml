outstanding_questions:
  - id: session-cooldown-final-model
    question: "Should therapist sessions remove hard cooldown entirely and rely only on escalating enjoyment costs?"
    current_state: "Hybrid timing remains (cooldown timer + rush fee), but session availability is affordability-gated instead of cooldown-locked."
    answer: "Implemented behavior already allows cooldown rushing. v5 should confirm whether to keep cooldown timer purely informational or retain it as rush-fee scaling input."

  - id: atelier-balance-target
    question: "What numeric target defines 'second run significantly faster' for Atelier progression?"
    current_state: "Bonuses are active, but explicit success criteria are not documented."
    answer: "A 50% improvement over the first run is a reasonable target for significant speedup, but this may be adjusted based on playtesting and player feedback."

  - id: watch-tier-movement-matching
    question: "Should tier assignment be movement-driven or stay curated by catalog tier tags?"
    current_state: "Catalog movement type is inferred and watch model tier IDs are derived from movement type, with fallback inference from catalog metadata."
    answer: "Direction remains movement-first, but v5 should add explicit contract checks for misclassified/low-confidence metadata entries."

  - id: next-unlock-placement
    question: "Do we want next-unlock preview in the top header, or is Collection/Career placement sufficient?"
    current_state: "No dedicated global next-unlock header panel; mission rail plus career guidance provides contextual direction."
    answer: "Pending v5 decision: keep mission rail as canonical guidance and reduce duplicate near-term preview copy in secondary sections."

  - id: catalog-filter-density
    question: "Should catalog filters move to a collapsed button (with active count badge), especially on mobile?"
    current_state: "Collapsed filter button pattern is already in place and tested."
    answer: "Implemented. v5 should preserve this as a contract and avoid regressions in mobile and e2e selector flows."

